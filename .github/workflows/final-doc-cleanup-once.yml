name: Final Documentation Cleanup Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize-docs:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/finish-environment-feasible-plan-20260824'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact final documentation cleanup
        run: python scripts/final_doc_cleanup_once.py

      - name: Commit finalized documentation state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: finalize current architecture references"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
