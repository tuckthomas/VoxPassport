name: Finalize Migration Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/finish-environment-feasible-plan-20260824'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply final exact-source migration
        run: python scripts/finalize_migration_once.py

      - name: Commit finalized source and documentation state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "migration: finalize Expo ownership and plan status"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
