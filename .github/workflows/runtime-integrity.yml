name: Runtime Integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install integrity-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio aiohttp

      - name: Compile Python sources
        run: python -m compileall -q runtime agents tests benchmarks scripts

      - name: Run runtime-routing integrity tests
        run: >-
          python -m pytest -q
          tests/integration/test_tts_adapter_integrity.py
          tests/integration/test_runtime_state_integrity.py
          tests/integration/test_low_vram_integrity.py
          tests/test_xtts_romanian.py
          tests/test_tts_backend_runtime_catalog.py
          tests/test_tts_plugin_architecture.py
          tests/test_tts_runtime_supervisor.py
          tests/test_tts_residency_contract.py
          tests/test_repository_architecture.py
          tests/test_translation_provider_catalog.py

  desktop-client:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/client/package.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install shared client dependencies
        run: npm install --prefix apps/client --no-audit --no-fund

      - name: Type-check shared Expo client
        run: npm run --prefix apps/client typecheck

      - name: Export shared web client for Tauri
        run: npm run --prefix apps/client export:web

      - name: Check portable audio crate
        run: cargo check --manifest-path crates/audio-core/Cargo.toml

      - name: Check Windows audio crate
        run: cargo check --manifest-path crates/audio-windows/Cargo.toml

      - name: Compile and run desktop-shell unit tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
