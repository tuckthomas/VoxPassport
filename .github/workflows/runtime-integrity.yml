name: Runtime Integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install integrity-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio aiohttp

      - name: Compile Python sources
        run: python -m compileall -q runtime agents tests

      - name: Run runtime-routing integrity tests
        run: >-
          python -m pytest -q
          tests/integration/test_tts_adapter_integrity.py
          tests/integration/test_runtime_state_integrity.py
          tests/integration/test_low_vram_integrity.py
