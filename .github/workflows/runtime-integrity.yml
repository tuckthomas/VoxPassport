name: Runtime Integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install integrity-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio aiohttp python-dotenv

      - name: Compile Python sources
        run: python -m compileall -q runtime agents tests benchmarks scripts

      - name: Run runtime-routing integrity tests
        run: >-
          python -m pytest -q
          tests/integration/test_tts_adapter_integrity.py
          tests/integration/test_runtime_state_integrity.py
          tests/integration/test_low_vram_integrity.py
          tests/test_xtts_romanian.py
          tests/test_tts_backend_runtime_catalog.py
          tests/test_tts_plugin_architecture.py
          tests/test_tts_runtime_supervisor.py
          tests/test_tts_residency_contract.py
          tests/test_repository_architecture.py
          tests/test_translation_provider_catalog.py
          tests/test_translation_strategy_loader.py
          tests/test_translation_session.py
          tests/test_translation_strategy_manager.py
          tests/test_gemini_live_translate.py
          tests/test_client_contract.py
          tests/test_client_http.py
          tests/test_native_audio_bridge.py
          tests/test_deployment_config.py
          tests/test_live_translation_controller.py
          tests/test_virtual_audio_driver_overlay.py

  account-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: voxpassport
          POSTGRES_USER: voxpassport
          POSTGRES_PASSWORD: voxpassport-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voxpassport -d voxpassport"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      VOXPASSPORT_ACCOUNTS_ENVIRONMENT: test
      VOXPASSPORT_ACCOUNTS_DATABASE_URL: postgresql+psycopg://voxpassport:voxpassport-ci@127.0.0.1:5432/voxpassport
      VOXPASSPORT_ACCOUNTS_JWT_SECRET: ci-jwt-secret-not-for-production-use
      VOXPASSPORT_ACCOUNTS_CREDENTIAL_MASTER_SECRET: ci-credential-secret-not-for-production-use
      VOXPASSPORT_ACCOUNTS_COOKIE_SECURE: "false"
    defaults:
      run:
        working-directory: services/account-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/account-api/requirements.txt

      - name: Install account-service dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile account service
        run: python -m compileall -q account_api tests alembic

      - name: Apply PostgreSQL migrations
        run: alembic upgrade head

      - name: Run account-service integration tests
        run: python -m pytest -q tests

  expo-client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Expo client dependencies
        run: npm install --prefix apps/client --no-audit --no-fund

      - name: Type-check Expo client
        run: npm run --prefix apps/client typecheck

      - name: Export Expo web client
        run: npm run --prefix apps/client export:web

  windows-audio:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate virtual-driver PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem drivers/windows/virtual-audio -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error ("{0}: {1}" -f $_.Name, ($errors | ForEach-Object Message -join '; '))
            }
          }
          if ($failed) { exit 1 }

      - name: Prepare pinned Microsoft virtual-audio substrate
        shell: pwsh
        run: ./drivers/windows/virtual-audio/prepare.ps1

      - name: Verify prepared virtual cable patches
        shell: pwsh
        run: |
          $root = 'drivers/windows/virtual-audio/.work/simpleaudiosample'
          $stream = Get-Content -Raw "$root/Source/Main/minwavertstream.cpp"
          $inf = Get-Content -Raw "$root/Source/Main/SimpleAudioSample.inx"
          $mic = Get-Content -Raw "$root/Source/Filters/micarraywavtable.h"
          if ($stream -notmatch 'VpAudioBridgeWrite' -or $stream -notmatch 'VpAudioBridgeRead') { throw 'PCM bridge patch missing' }
          if ($inf -notmatch 'ROOT\\VoxPassportVirtualAudio') { throw 'VoxPassport hardware id missing' }
          if ($inf -notmatch 'VoxPassport Translation Sink' -or $inf -notmatch 'VoxPassport Virtual Microphone') { throw 'endpoint names missing' }
          if ($mic -notmatch '192000' -or $mic -notmatch 'MICARRAY_BITS_PER_SAMPLE_PCM') { throw 'capture PCM normalization missing' }
          if (-not (Test-Path "$root/MICROSOFT-LICENSE.txt")) { throw 'Microsoft MS-PL license was not preserved' }

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test portable audio crate
        run: cargo test --manifest-path crates/audio-core/Cargo.toml --all-targets

      - name: Test Windows audio crate and helper
        run: cargo test --manifest-path crates/audio-windows/Cargo.toml --all-targets
