<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="brand" x1="210" y1="280" x2="820" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.52" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="wave" x1="280" y1="512" x2="744" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.58" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientTransform="translate(338 322) rotate(42) scale(500)">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx="0" cy="0" r="1" gradientTransform="translate(710 720) rotate(-125) scale(470)">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <clipPath id="tileClip"><rect x="40" y="40" width="944" height="944" rx="220"/></clipPath>
  </defs>

  <!-- UI-matched app tile -->
  <rect x="40" y="40" width="944" height="944" rx="220" fill="#0b0f19"/>
  <g clip-path="url(#tileClip)">
    <rect x="40" y="40" width="944" height="944" fill="url(#glowBlue)"/>
    <rect x="40" y="40" width="944" height="944" fill="url(#glowIndigo)"/>
  </g>
  <rect x="41.5" y="41.5" width="941" height="941" rx="218.5" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>

  <!-- Global / translation mark -->
  <g filter="url(#shadow)">
    <circle cx="512" cy="512" r="282" fill="#0f1420" fill-opacity="0.58" stroke="url(#brand)" stroke-width="34"/>

    <!-- Globe geometry -->
    <ellipse cx="512" cy="512" rx="137" ry="282" fill="none" stroke="#94a3b8" stroke-opacity="0.56" stroke-width="24"/>
    <path d="M255 407C333 373 421 355 512 355C603 355 691 373 769 407" fill="none" stroke="#94a3b8" stroke-opacity="0.48" stroke-width="24" stroke-linecap="round"/>
    <path d="M255 617C333 651 421 669 512 669C603 669 691 651 769 617" fill="none" stroke="#94a3b8" stroke-opacity="0.48" stroke-width="24" stroke-linecap="round"/>
    <path d="M232 512H792" fill="none" stroke="#f8fafc" stroke-opacity="0.76" stroke-width="26" stroke-linecap="round"/>

    <!-- Voice waveform, the primary silhouette -->
    <g filter="url(#softGlow)" stroke="url(#wave)" stroke-width="44" stroke-linecap="round">
      <path d="M312 470V554"/>
      <path d="M362 428V596"/>
      <path d="M412 375V649"/>
      <path d="M462 330V694"/>
      <path d="M512 390V634"/>
      <path d="M562 306V718"/>
      <path d="M612 365V659"/>
      <path d="M662 422V602"/>
      <path d="M712 468V556"/>
    </g>
  </g>

  <!-- Small live/local status cue from the existing emerald accent -->
  <circle cx="760" cy="754" r="42" fill="#0b0f19" stroke="#0b0f19" stroke-width="18"/>
  <circle cx="760" cy="754" r="26" fill="#10b981"/>
</svg>
