<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveTranslator Subtitle Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #101622;
      --card-border: #1c2638;
      --card-section-bg: #0b0f19;
      --card-section-border: #25334a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      --accent-primary: #3b82f6;
      --color-success: #10b981;
      --color-success-bg: rgba(16, 185, 129, 0.1);
      --color-success-border: rgba(16, 185, 129, 0.3);

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-full: 9999px;
      --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--color-success-bg);
      border: 1px solid var(--color-success-border);
      border-radius: var(--radius-full);
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 700;
      color: var(--color-success);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-success);
    }

    .card-section {
      background: var(--card-section-bg);
      border: 1px solid var(--card-section-border);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 800;
      color: #60a5fa;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .caption-text {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.45;
      min-height: 24px;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 4px;
    }

    .controls-row {
      display: flex;
      gap: 10px;
    }

    .btn-clean {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 16px;
      background: #2563eb;
      border: 1px solid #3b82f6;
      border-radius: 4px;
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      line-height: 1.2;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      box-shadow: 0 3px 0 0 #1d4ed8, 0 5px 10px rgba(0, 0, 0, 0.4);
      transform: translateY(0);
      transition: transform 0.06s ease, box-shadow 0.06s ease, filter 0.1s ease;
    }

    .btn-clean:hover {
      filter: brightness(1.12);
    }

    .btn-clean:active {
      transform: translateY(3px);
      box-shadow: 0 0 0 0 #1d4ed8, 0 1px 3px rgba(0, 0, 0, 0.3);
    }

    /* Ultra-Modern Global Tooltip Component */
    .studio-tooltip {
      position: fixed;
      z-index: 100000;
      pointer-events: none;
      padding: 6px 11px;
      background: rgba(13, 19, 33, 0.96);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(96, 165, 250, 0.35);
      border-radius: 6px;
      box-shadow: 0 10px 25px -4px rgba(0, 0, 0, 0.7), 0 0 14px rgba(59, 130, 246, 0.2);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #f8fafc;
      white-space: nowrap;
      opacity: 0;
      transform: scale(0.94);
      transition: opacity 0.14s cubic-bezier(0.16, 1, 0.3, 1), transform 0.14s cubic-bezier(0.16, 1, 0.3, 1);
      display: none;
      align-items: center;
      gap: 6px;
    }

    .studio-tooltip.visible {
      opacity: 1;
      transform: scale(1);
    }

    .studio-tooltip-arrow {
      position: absolute;
      width: 8px;
      height: 8px;
      background: rgba(13, 19, 33, 0.96);
      border: 1px solid rgba(96, 165, 250, 0.35);
      transform: rotate(45deg);
    }

    .studio-tooltip[data-pos="top"] .studio-tooltip-arrow {
      bottom: -5px;
      left: calc(50% - 4px);
      border-top: none;
      border-left: none;
    }

    .studio-tooltip[data-pos="bottom"] .studio-tooltip-arrow {
      top: -5px;
      left: calc(50% - 4px);
      border-bottom: none;
      border-right: none;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <div class="top-bar">
      <div class="brand-title">LiveTranslator Subtitle Stream</div>
      <div class="status-badge" data-tooltip="Live WebSocket status connection" data-tooltip-pos="bottom">
        <span class="status-dot"></span>
        <span id="connStatus">Connected</span>
      </div>
    </div>

    <!-- Live Original English Transcription -->
    <div class="card-section">
      <div class="section-label">Original Speech (English)</div>
      <div class="caption-text" id="originalText">Waiting for audio input...</div>
      <div class="meta-row">
        <span>ASR: NVIDIA Parakeet v3</span>
        <span id="asrLatency">0ms</span>
      </div>
    </div>

    <!-- Live Translated Romanian Speech -->
    <div class="card-section" style="background: var(--color-success-bg); border-color: var(--color-success-border);">
      <div class="section-label" style="color: var(--color-success);">Live Translation (Romanian)</div>
      <div class="caption-text" id="translatedText">În așteptarea intrării audio...</div>
      <div class="meta-row">
        <span>Translation: MiLMMT-46-1B</span>
        <span id="transLatency">0ms</span>
      </div>
    </div>

    <div class="controls-row">
      <a class="btn-clean" href="/manager/index.html" target="_blank" data-tooltip="Switch to full Studio & Model Manager workspace" data-tooltip-pos="top">Open Voice Studio & Model Manager</a>
    </div>

  </div>

  <script>
    let ws = null;

    function connectWs() {
      const wsUrl = "ws://127.0.0.1:8765/ws/captions";
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        document.getElementById('connStatus').textContent = "Live Stream Active";
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.source_text) {
            document.getElementById('originalText').textContent = data.source_text;
          }
          if (data.translated_text) {
            document.getElementById('translatedText').textContent = data.translated_text;
          }
          if (data.latency_ms) {
            document.getElementById('transLatency').textContent = data.latency_ms + "ms";
          }
        } catch(e) {}
      };

      ws.onclose = () => {
        document.getElementById('connStatus').textContent = "Reconnecting...";
        setTimeout(connectWs, 2000);
      };
    }

    connectWs();

    // Global Modern Tooltip System
    (function initGlobalTooltip() {
      let tooltipEl = null;
      let arrowEl = null;
      let hideTimeout = null;

      function createTooltipElement() {
        if (tooltipEl) return;
        tooltipEl = document.createElement('div');
        tooltipEl.className = 'studio-tooltip';
        arrowEl = document.createElement('div');
        arrowEl.className = 'studio-tooltip-arrow';
        tooltipEl.appendChild(arrowEl);
        document.body.appendChild(tooltipEl);
      }

      function showTooltip(target, text, pos = 'top') {
        if (!text || !target) return;
        createTooltipElement();

        if (hideTimeout) clearTimeout(hideTimeout);

        tooltipEl.innerHTML = '';
        const textSpan = document.createElement('span');
        textSpan.textContent = text;
        tooltipEl.appendChild(textSpan);
        tooltipEl.appendChild(arrowEl);

        tooltipEl.setAttribute('data-pos', pos);
        tooltipEl.style.display = 'flex';
        tooltipEl.style.visibility = 'hidden';
        tooltipEl.classList.remove('visible');

        const rect = target.getBoundingClientRect();
        const tipRect = tooltipEl.getBoundingClientRect();
        const margin = 8;

        let top = 0;
        let left = 0;

        if (pos === 'top') {
          top = rect.top - tipRect.height - margin;
          left = rect.left + (rect.width / 2) - (tipRect.width / 2);
          if (top < 8) {
            pos = 'bottom';
            top = rect.bottom + margin;
            tooltipEl.setAttribute('data-pos', 'bottom');
          }
        } else if (pos === 'bottom') {
          top = rect.bottom + margin;
          left = rect.left + (rect.width / 2) - (tipRect.width / 2);
        }

        left = Math.max(8, Math.min(window.innerWidth - tipRect.width - 8, left));
        top = Math.max(8, Math.min(window.innerHeight - tipRect.height - 8, top));

        tooltipEl.style.top = `${top}px`;
        tooltipEl.style.left = `${left}px`;
        tooltipEl.style.visibility = 'visible';
        
        requestAnimationFrame(() => {
          tooltipEl.classList.add('visible');
        });
      }

      function hideTooltip() {
        if (!tooltipEl) return;
        tooltipEl.classList.remove('visible');
        hideTimeout = setTimeout(() => {
          if (tooltipEl && !tooltipEl.classList.contains('visible')) {
            tooltipEl.style.display = 'none';
          }
        }, 150);
      }

      document.addEventListener('mouseover', (e) => {
        const target = e.target.closest('[data-tooltip], [title]');
        if (!target) return;

        if (target.hasAttribute('title') && target.getAttribute('title')) {
          target.setAttribute('data-tooltip', target.getAttribute('title'));
          target.removeAttribute('title');
        }

        const text = target.getAttribute('data-tooltip');
        const pos = target.getAttribute('data-tooltip-pos') || 'top';
        showTooltip(target, text, pos);
      }, true);

      document.addEventListener('mouseout', (e) => {
        const target = e.target.closest('[data-tooltip], [title]');
        if (target) hideTooltip();
      }, true);

      document.addEventListener('focusin', (e) => {
        const target = e.target.closest('[data-tooltip]');
        if (target) {
          const text = target.getAttribute('data-tooltip');
          const pos = target.getAttribute('data-tooltip-pos') || 'top';
          showTooltip(target, text, pos);
        }
      }, true);

      document.addEventListener('focusout', () => hideTooltip(), true);
    })();
  </script>
</body>
</html>
