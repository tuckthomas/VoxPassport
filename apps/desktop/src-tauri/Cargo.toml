[package]
name = "voxpassport-desktop"
version = "0.1.0"
description = "VoxPassport desktop application shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
livetranslator-audio-core = { path = "../../../crates/audio-core" }
livetranslator-audio-windows = { path = "../../../crates/audio-windows" }

[features]
default = []
